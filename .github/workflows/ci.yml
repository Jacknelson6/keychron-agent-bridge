name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test dependencies
        run: python -m pip install pytest==9.2.0 build
      - name: Python tests (no keyboard required)
        run: python -m pytest -q
      - name: Native Bluetooth protocol tests
        run: sh tests/firmware/run_agent_protocol_tests.sh
      - name: Preview the extension example
        run: python examples/custom_visual.py --agent codex --status working
      - name: Build source distribution and wheel
        if: runner.os == 'Linux'
        run: python -m build --outdir build/package
