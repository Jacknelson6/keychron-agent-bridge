name: Bug report
description: Report a reproducible app, hook, or lighting problem.
body:
  - type: input
    id: hardware
    attributes:
      label: Keyboard model, layout, and firmware
      placeholder: V1 Max ANSI knob, v1.1.1, USB or Bluetooth
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: macOS, Python, and bridge version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Share error messages only. Do not attach backups, session metadata, transcripts, private paths, or firmware dumps.
